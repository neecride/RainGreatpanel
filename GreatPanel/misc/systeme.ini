[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1

[Metadata]
Name=GreatPanel
Author=neecride

[MeterBackground]
Meter=Image
ImageName=#@#/Images/bgm.png
W=165
H=165

; ---------- VARIABLES ----------
[Variables]
@IncludeVariables=#@#variables.inc

[measureCPU]
Measure=CPU
Processor=0

[measureRAM]
Measure=PhysicalMemory
UpdateDivider=20

[measureSWAP]
Measure=SWAPMemory
UpdateDivider=20

[styleBar]
BarColor=46,50,97,255
BarOrientation=HORIZONTAL
SolidColor=255,255,255,50

[styleLeftText]
FontFace=#Font#
FontSize=11
FontColor=179,179,179,255
AntiAlias=1
StringAlign=left

[styleRightText]
FontFace=#Font#
FontSize=11
FontColor=179,179,179,255
AntiAlias=1
StringAlign=right

[meterLabelCPU]
Meter=STRING
MeterStyle=styleLeftText
X=10
Y=85
Text="CPU Usage"

[meterValueCPU]
Meter=STRING
MeterStyle=styleRightText
MeasureName=measureCPU
X=150
Y=r
Text="%1%"

[meterBarCPU]
Meter=BAR
MeterStyle=styleBar
MeasureName=measureCPU
X=10
Y=15r
W=142
H=1

[meterLabelRAM]
Meter=STRING
MeterStyle=styleLeftText
X=10
Y=110
Text="RAM Usage"

[meterValueRAM]
Meter=STRING
MeterStyle=styleRightText
MeasureName=measureRAM
X=150
Y=r
Text="%1%"
Percentual=1

[meterBarRAM]
Meter=BAR
MeterStyle=styleBar
MeasureName=measureRAM
X=10
Y=15r
W=142
H=1

[meterLabelSWAP]
Meter=STRING
MeterStyle=styleLeftText
X=10
Y=135
Text="SWAP Usage"

[meterValueSWAP]
Meter=STRING
MeterStyle=styleRightText
MeasureName=measureSWAP
X=150
Y=r
Text="%1%"
Percentual=1

[meterBarSWAP]
Meter=BAR
MeterStyle=styleBar
MeasureName=measureSWAP
X=10
Y=15r
W=142
H=1